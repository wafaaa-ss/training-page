<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header id="header">
    <nav>
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="19" fill="#fff" />
          <path d="M15 12 7 20l8 8M25 12l8 8-8 8" fill="none" stroke="#7a0f1a" stroke-width="3.5" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <span data-i18n="title">Training</span>
      </div>
      <div class="actions">
        <button class="btn" id="langBtn">العربية</button>
        <button class="btn" id="addBtn"><span aria-hidden="true">+</span> <span data-i18n="add">Add
            content</span></button>
        <button class="btn" id="removeBtn"><span aria-hidden="true">−</span> <span data-i18n="remove">Remove
            content</span></button>
      </div>
    </nav>
    <div id="updates"></div>
  </header>

  <div class="layout">
    <main>
      <section class="hero">
        <div id="heart" aria-label="Rotating 3D heart"></div>
        <div class="redbox" id="redbox">
          <h2>CSS Animation</h2>
        </div>
      </section>

      <section class="content">
        <h1 data-i18n="sectionTitle">HTML, CSS &amp; JavaScript</h1>

        <article class="card">
          <svg viewBox="0 0 64 64" aria-label="HTML logo">
            <path d="M6 4h52l-5 50-21 6-21-6z" fill="#e44d26" />
            <path d="M32 8v48l17-5 4-43z" fill="#f16529" />
            <path d="M18 18h28l-1 8H26l1 6h17l-2 16-10 3-10-3-1-8h8l.5 4 3.5 1 3.5-1 .7-7H20z" fill="#fff" />
          </svg>
          <div>
            <h3>HTML</h3>
            <p data-i18n="html1"></p>
            <p data-i18n="html2"></p>
          </div>
        </article>

        <article class="card">
          <svg viewBox="0 0 64 64" aria-label="CSS logo">
            <path d="M6 4h52l-5 50-21 6-21-6z" fill="#1572b6" />
            <path d="M32 8v48l17-5 4-43z" fill="#33a9dc" />
            <path d="M18 18h28l-.8 8H26l.6 6h17l-1.800 16L32 51l-10-3-.7-8h8l.4 4 2.300 1 3.500-1 .5-6H20z"
              fill="#fff" />
          </svg>
          <div>
            <h3>CSS</h3>
            <p data-i18n="css1"></p>
            <p data-i18n="css2"></p>
          </div>
        </article>

        <article class="card">
          <svg viewBox="0 0 64 64" aria-label="JavaScript logo">
            <rect x="4" y="4" width="56" height="56" rx="4" fill="#f7df1e" />
            <path
              d="M38 46c1 2 2.500 3.500 5 3.500 2 0 3.500-1 3.500-2.500 0-1.800-1.400-2.400-3.800-3.500l-1.300-.6c-3.700-1.600-6.200-3.500-6.200-7.600 0-3.800 2.900-6.600 7.400-6.600 3.200 0 5.500 1.100 7.100 4l-3.900 2.500c-.9-1.600-1.800-2.200-3.200-2.200-1.500 0-2.400.9-2.400 2.200 0 1.500.9 2.100 3.100 3l1.300.6c4.300 1.900 6.800 3.700 6.800 8 0 4.600-3.600 7.100-8.500 7.100-4.700 0-7.800-2.200-9.300-5.200zM20 46.500c.8 1.400 1.500 2.600 3.200 2.600 1.600 0 2.600-.6 2.600-3.100V29h5v17c0 5.100-3 7.400-7.300 7.400-3.900 0-6.200-2-7.300-4.500z"
              fill="#222" />
          </svg>
          <div>
            <h3>JavaScript</h3>
            <p data-i18n="js1"></p>
            <p data-i18n="js2"></p>
          </div>
        </article>
      </section>
    </main>

    <aside id="menu">
      <div id="menuList"></div>
    </aside>
  </div>

  <button class="fab" id="fab" aria-label="Add content">+</button>

  <footer>
    <span data-i18n="title">Training</span>
    <span>© 2026</span>
    <span data-i18n="rights">All rights reserved</span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
